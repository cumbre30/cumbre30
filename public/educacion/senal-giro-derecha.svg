<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Ciclista visto desde atrás señalizando giro a la derecha con el brazo derecho extendido horizontalmente">
  <!-- Tarjeta -->
  <rect x="4" y="4" width="232" height="172" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Piso -->
  <line x1="32" y1="152" x2="208" y2="152" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <!-- Rueda trasera vista de canto -->
  <ellipse cx="120" cy="126" rx="7" ry="26" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Asiento y tija -->
  <rect x="106" y="86" width="28" height="8" rx="4" fill="#334155"/>
  <line x1="120" y1="94" x2="120" y2="101" stroke="#334155" stroke-width="4"/>
  <!-- Torso -->
  <rect x="102" y="42" width="36" height="50" rx="18" fill="#334155"/>
  <!-- Cabeza -->
  <circle cx="120" cy="26" r="13" fill="#334155"/>
  <!-- Manubrio (por detrás del torso) -->
  <line x1="88" y1="50" x2="152" y2="50" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <!-- Brazo izquierdo en reposo hacia el puño -->
  <line x1="106" y1="56" x2="92" y2="52" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <!-- Señal: brazo derecho extendido horizontal -->
  <line x1="136" y1="56" x2="196" y2="56" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
  <circle cx="202" cy="56" r="8" fill="#059669"/>
  <!-- Flecha de dirección -->
  <line x1="180" y1="20" x2="214" y2="20" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  <polyline points="206,12 214,20 206,28" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
