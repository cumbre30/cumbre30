name: Build APK Cumbre30

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publica el Release con el APK adjunto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Restore debug keystore (SHA-1 estable para Google Sign-In)
        run: |
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore

      - name: Build web estático (excluye rutas API)
        run: bash scripts/export-web.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug firmado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Nombra el APK según versión y code del build.gradle
        run: |
          VN=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          VC=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          cp android/app/build/outputs/apk/debug/app-debug.apk "cumbre30-v${VN}-code${VC}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "cumbre30-latest.apk"
          echo "APK generado: cumbre30-v${VN}-code${VC}.apk"

      - name: Publica el Release de GitHub (solo en pushes de tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Cumbre30 ${{ github.ref_name }}
          files: |
            cumbre30-v*-code*.apk
            cumbre30-latest.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload APK (artifact para corridas manuales)
        uses: actions/upload-artifact@v4
        with:
          name: Cumbre30-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
