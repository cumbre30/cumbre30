name: Build APK Cumbre30

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Restore debug keystore (SHA-1 estable para Google Sign-In)
        run: |
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore

      - name: Build web estático (excluye rutas API)
        run: bash scripts/export-web.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug firmado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cumbre30-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
